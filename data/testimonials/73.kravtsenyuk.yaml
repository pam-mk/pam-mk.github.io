bio: "Dr. Maryana Kravtsenyuk is a forensic psychiatrist at the Centre for Addiction and
Mental Health (CAMH) in Toronto, and she is an Assistant Professor at the University of
Toronto, and Associate Professor at the University of Alberta and Visiting Professor in
the Department of Psychiatry, and at the Northern Ontario School of Medicine.\n

She is an active member of the Canadian Academy of Psychiatry and the Law (CAPL,Royal College of Physicians and Surgeons of Canada (RCPSC), the Canadian
Psychiatric Association (CPA), and previously served on Alberta&#39;s Mental Health
Review Panel. Dr Kravtsenyuk serves on Ontario and Alberta Provincial Criminal Code Review
Boards. Her forensic practice includes work in secure and rehabilitation units, outpatient
forensics clinics, correctional clinics in provincial and federal institutions, and courts. In
addition to this work, she is highly committed to research and medical education at the
undergraduate and resident level."