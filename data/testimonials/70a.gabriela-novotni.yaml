bio: |
  Gabriela Novotni, MD, PhD, is a neurologist and Associate Professor at the University Clinic of Neurology in Skopje, where she has worked since 2009. She completed her neurology specialization in 2013 and has built her career in cognitive neurology, neurodegeneration, and movement disorders.

  Her international training includes education in dementia diagnostics and neuropsychology at the University Clinic in Nuremberg (2015), the Memory Clinic in Belgrade (2016), and an educational stay at the Neurology Clinic in Ljubljana (2026) focusing on advanced Parkinson’s disease management and DBS.

  Dr. Novotni established the Dementia Outpatient Clinic in 2016 and contributed to the creation of a national DNA bank for neurodegenerative diseases. She defended her PhD in 2019 on risk and predictive factors for Alzheimer’s disease and was appointed Associate Professor in 2026. In 2023 she became Head of the newly formed Department of Cognitive Neurology and Neurodegenerative Diseases, leading clinical, academic, and research development in dementia care and diagnostics.

  She has participated in numerous international studies and European initiatives.

  Alongside her clinical and research work, Dr. Novotni is active in public advocacy. She founded the Institute for Alzheimer’s Disease and Neuroscience in 2018, organizing national dementia education programs, masterclasses, thematic conferences, and neuropathology workshops. She is a member of MDS, EAN, the Macedonian Neurology Society, and serves as an ambassador of the International Association of Parkinsonism and Related Disorders.
