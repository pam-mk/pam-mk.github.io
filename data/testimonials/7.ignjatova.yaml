bio: "Liljana Ignjatova is psychiatrist, head of the Department of Prevention and Treatment of
Drug Abuse and Abuse of the Other Psychoactive Substances and Professor at the Medical
faculty of the University St. Cyril and Methodius in Skopje. She became a founding member
of the World Federation for the Treatment of Opiate Dependence, Chair of National
Scientific Committees of the European Opiate Addiction Treatment Association
(EUROPAD).\n

Since 2011 she is permanent correspondent from North Macedonia for The
Council of Europe International Co-operation Group on Drugs and Addictions. Since 2018
Liljana is member of the Macedonian National Task Force for Problematic Usage of Internet.
She is International Certified Addiction Professional (ICAP), ENCP and UNODC Treat Net
trainer for Management of drug dependence treatment services and for Elements of
psychosocial therapy. Liljana is awarded with „SEE net Reflection Award” in 2015,
EUROPAD Chimera Award in 2022, World Association on Dual Disorders (WADD) award
in 2023, Recognition of permanent values in Macedonian psychiatry in 2023 and Recognition
for exceptional contribution and personal commitment to establishing and maintaining drug
treatment in CSO HOPS in 2024."
